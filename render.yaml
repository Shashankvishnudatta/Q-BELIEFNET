services:
  - type: web
    name: q-belief-net-backend
    env: python
    plan: free
    pythonVersion: 3.12.3
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: demo
      - key: DATA_MODE
        value: demo
      - key: APP_ENV
        value: render
