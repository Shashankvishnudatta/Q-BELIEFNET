services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: q-beliefnet-backend
    environment:
      APP_MODE: demo
      DATA_MODE: demo
      APP_ENV: docker
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: q-beliefnet-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
      VITE_APP_MODE: demo
      VITE_ENABLE_DEMO_BADGES: "true"
    ports:
      - "3000:80"
